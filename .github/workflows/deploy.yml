name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências — Inventário de Máquinas
        working-directory: inventario-maquinas
        run: npm install

      - name: Build — Inventário de Máquinas
        working-directory: inventario-maquinas
        run: npm run build

      - name: Montar site
        run: |
          mkdir -p _site
          cp -r web/. _site/
          mkdir -p _site/inventario-maquinas
          cp -r inventario-maquinas/dist/. _site/inventario-maquinas/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
